# Control for the phrase tokenizers: plain BPE at a vocabulary as large as theirs, on raw text.
# Budget = equal ORIGINAL characters seen (463M, what exp_raw saw), so bits per character is directly
# comparable and the compute saving shows up in the FLOPs columns. Needs no compression stage.
extends: exp_raw.yaml
tokenizer:
  kind: bpe
  vocab_size: 32000
llm:
  batch_size: 16      # x grad_accum 2 = same 32 seqs/step as exp_raw; halves the logits memory (33k vocab OOMs an 11.6 GB GPU otherwise)
  grad_accum: 2
  budget: {mode: orig_chars, value: 463000000}
