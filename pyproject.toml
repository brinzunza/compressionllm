[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cllm"
version = "0.1.0"
description = "Does training language models on learned, context-aware letter-dropping compression pay off? A modular experiment pipeline."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "torch>=2.1",
  "transformers>=4.40",
  "tokenizers>=0.19",
  "pyyaml",
  "tqdm",
  "psutil",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cllm = "cllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
